
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReachU - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-app-container {
            background-color: #f4f4f4;
            width: 100%;
            max-width: 375px;
            height: 100vh;
            min-height: 100vh;
            padding: 48px 32px 32px 32px;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
        }

        @media (max-width: 480px) {
            .mobile-app-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }

            .header-section {
                margin-top: 40px;
            }
        }

        .header-section {
            text-align: left;
        }

        .brand-logo {
            font-size: 36px;
            font-weight: bold;
            color: #007BFF;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
            font-weight: 600;
        }

        h2 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .form-content {
            flex-grow: 1;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #007BFF;
            outline: none;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-button:hover {
            background-color: #0056b3;
        }

        .footer-links {
            margin-top: 16px;
            text-align: center;
        }

        .footer-links a {
            color: #007BFF;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .app-tagline {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="mobile-app-container">

        <div class="header-section">
            <h2>Sign Up</h2>
            <div class="brand-logo">ReachU</div>
            <div class="subtitle">Your Gateway to Peace</div>
        </div>

        <div class="form-content">
            <form id="signupForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username"
                           name="username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                           name="password" required>
                </div>

                <button type="submit" class="login-button">
                    Sign Up
                </button>
            </form>

            <div class="footer-links">
                Already have an account?
                <a href="index.html">Log In</a>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('signupForm')
            .addEventListener('submit', function(event) {
                event.preventDefault();

                alert('Sign-up form submitted!');
            });
    </script>
</body>
</html>
