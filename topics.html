<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReachU - Select Topics</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .mobile-app-container {
        background-color: #f4f4f4;
        width: 100%;
        max-width: 375px;
        height: 100vh;
        min-height: 100vh;
        padding: 48px 32px 32px 32px;
        display: flex;
        flex-direction: column;
        border-radius: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        position: relative;
    }

    @media (max-width: 480px) {
        .mobile-app-container {
            max-width: 100%;
            height: 100vh;
            max-height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }

        .header-section {
            margin-top: 40px;
        }
    }

    .header-section {
        text-align: left;
        margin-bottom: 24px;
    }

    .brand-logo {
        font-size: 36px;
        font-weight: bold;
        color: #007BFF;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
    }

    .subtitle {
        font-size: 14px;
        color: #666;
        font-weight: 600;
    }

    .section-title {
        font-size: 18px;
        font-weight: bold;
        color: #333;
        text-align: center;
        margin-bottom: 16px;
        line-height: 1.3;
    }

    .form-content {
        flex-grow: 1;
        overflow-y: auto;
    }

    .topic-button {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        background-color: #fff;
        border: 1px solid #ccc;
        color: #333;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: all 0.2s ease;
    }

    .topic-button:hover {
        background-color: #007BFF;
        border-color: #007BFF;
        color: #fff;
    }

    .topic-button.selected {
        background-color: #007BFF;
        border-color: #007BFF;
        color: #fff;
    }

    .filter-input {
        width: 100%;
        padding: 12px;
        margin-bottom: 24px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .filter-input:focus {
        border-color: #007BFF;
        outline: none;
    }

    .done-button {
        width: 100%;
        padding: 12px;
        background-color: #007BFF;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: auto;
    }

    .done-button:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
    <div class="mobile-app-container">
        <div class="header-section">
            <div class="brand-logo">ReachU</div>
        </div>
        <div class="form-content">
            <h2 class="section-title" style="margin-top: 36px;">What topics would you<br>like to see?</h2>

            <button class="topic-button" onclick="toggleSelect(this)">Anxiety</button>
            <button class="topic-button" onclick="toggleSelect(this)">Depression</button>
            <button class="topic-button" onclick="toggleSelect(this)">OCD</button>
            <button class="topic-button" onclick="toggleSelect(this)">Loneliness</button>
            <button class="topic-button" onclick="toggleSelect(this)">Insecurity</button>

            <h2 class="section-title">What would you<br>like to avoid seeing?</h2>
            <input type="text" class="filter-input" placeholder="Fill in words to filter out">
        </div>
        <button class="done-button" onclick="location.href='dashboard.html'">DONE</button>
    </div>

    <script>
        function toggleSelect(button) {
            button.classList.toggle('selected');
        }
    </script>

</body>
</html>
